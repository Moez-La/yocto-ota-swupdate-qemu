  /mnt/windows/yocto-ota-swupdate-qemu/meta-openembedded/meta-oe \
  /mnt/windows/yocto-ota-swupdate-qemu/meta-swupdate \
  /mnt/windows/yocto-ota-swupdate-qemu/meta-moez \
  "
