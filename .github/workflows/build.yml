name: OTA Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: |
          find . -name "*.bb" -o -name "*.c" -o -name "*.sh" -o -name "*.cfg" | sort

      - name: Check required files
        run: |
          echo "=== Checking project structure ==="
          test -f meta-moez/recipes-core/images/gateway-image.bb && echo "✅ gateway-image.bb" || echo "❌ gateway-image.bb MISSING" 
          test -f meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v1.c && echo "✅ gateway-monitor-v1.c" || echo "❌ gateway-monitor-v1.c MISSING"
          test -f meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v2.c && echo "✅ gateway-monitor-v2.c" || echo "❌ gateway-monitor-v2.c MISSING"
          test -f meta-moez/recipes-bsp/u-boot/files/qemu_arm_virt_defconfig_fragment.cfg && echo "✅ u-boot config" || echo "❌ u-boot config MISSING"
          test -f meta-moez/recipes-core/boot-confirm/boot-confirm_1.0.bb && echo "✅ boot-confirm recipe" || echo "❌ boot-confirm MISSING"
          test -f swu/sw-description && echo "✅ sw-description" || echo "❌ sw-description MISSING"
          test -f swu/postinstall.sh && echo "✅ postinstall.sh" || echo "❌ postinstall.sh MISSING"
          test -f swu/create-swu.sh && echo "✅ create-swu.sh" || echo "❌ create-swu.sh MISSING"
          test -f swu/create-swu-corrupted.sh && echo "✅ create-swu-corrupted.sh" || echo "❌ create-swu-corrupted.sh MISSING"
          test -f scripts/run-qemu.sh && echo "✅ run-qemu.sh" || echo "❌ run-qemu.sh MISSING"
