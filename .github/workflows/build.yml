name: OTA Pipeline CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          echo "=== Checking project structure ==="
          test -f meta-moez/recipes-core/images/gateway-image.bb && echo "✅ gateway-image.bb" || exit 1
          test -f meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v1.c && echo "✅ gateway-monitor-v1.c" || exit 1
          test -f meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v2.c && echo "✅ gateway-monitor-v2.c" || exit 1
          test -f meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v3.c && echo "✅ gateway-monitor-v3.c" || exit 1
          test -f meta-moez/recipes-bsp/u-boot/files/qemu_arm_virt_defconfig_fragment.cfg && echo "✅ u-boot config" || exit 1
          test -f meta-moez/recipes-bsp/u-boot/files/secureboot.cfg && echo "✅ secureboot config" || exit 1
          test -f meta-moez/recipes-core/boot-confirm/boot-confirm_1.0.bb && echo "✅ boot-confirm recipe" || exit 1
          test -f swu/sw-description && echo "✅ sw-description" || exit 1
          test -f swu/preinst.sh && echo "✅ preinst.sh" || exit 1
          test -f swu/postinstall.sh && echo "✅ postinstall.sh" || exit 1
          test -f swu/create-swu.sh && echo "✅ create-swu.sh" || exit 1
          test -f swu/create-swu-corrupted.sh && echo "✅ create-swu-corrupted.sh" || exit 1
          test -f scripts/run-qemu.sh && echo "✅ run-qemu.sh" || exit 1
          test -f secureboot/fit/kernel.its && echo "✅ kernel.its" || exit 1
          test -f secureboot/keys/fit-public.crt && echo "✅ fit-public.crt" || exit 1
          echo "=== All checks passed ==="
      - name: Validate sw-description
        run: |
          grep -q "version" swu/sw-description && echo "✅ version field"
          grep -q "hardware-compatibility" swu/sw-description && echo "✅ hardware-compatibility"
          grep -q "postinstall.sh" swu/sw-description && echo "✅ postinstall.sh referenced"
          grep -q "preinst.sh" swu/sw-description && echo "✅ preinst.sh referenced"
          grep -q "preinstall" swu/sw-description && echo "✅ preinstall type"
          grep -q "postinstall" swu/sw-description && echo "✅ postinstall type"
          grep -q "target_slot" swu/sw-description && echo "✅ dynamic slot targeting"
      - name: Validate U-Boot config
        run: |
          grep -q "CONFIG_ENV_IS_NOWHERE=y" meta-moez/recipes-bsp/u-boot/files/qemu_arm_virt_defconfig_fragment.cfg && echo "✅ ENV_IS_NOWHERE"
          grep -q "CONFIG_BOOTCOMMAND" meta-moez/recipes-bsp/u-boot/files/qemu_arm_virt_defconfig_fragment.cfg && echo "✅ BOOTCOMMAND"
          grep -q "CONFIG_FIT_SIGNATURE=y" meta-moez/recipes-bsp/u-boot/files/secureboot.cfg && echo "✅ FIT_SIGNATURE"
          grep -q "CONFIG_RSA=y" meta-moez/recipes-bsp/u-boot/files/secureboot.cfg && echo "✅ RSA"
      - name: Validate gateway-monitor sources
        run: |
          grep -q "1.0.0" meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v1.c && echo "✅ v1.0.0"
          grep -q "2.0.0" meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v2.c && echo "✅ v2.0.0"
          grep -q "3.0.0" meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v3.c && echo "✅ v3.0.0"
          grep -q "proc/cmdline" meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v1.c && echo "✅ dynamic slot v1"
          grep -q "proc/cmdline" meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v2.c && echo "✅ dynamic slot v2"
          grep -q "proc/cmdline" meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v3.c && echo "✅ dynamic slot v3"
          grep -q "bandwidth" meta-moez/recipes-app/gateway-monitor/files/gateway-monitor-v3.c && echo "✅ bandwidth monitoring v3"
      - name: Validate preinst script
        run: |
          grep -q "vda1" swu/preinst.sh && echo "✅ preinst reads vda1"
          grep -q "target_slot" swu/preinst.sh && echo "✅ preinst creates target_slot"
      - name: Summary
        run: |
          echo "================================"
          echo "   OTA Pipeline CI — PASSED ✅"
          echo "================================"
          echo "  Project structure   : ✅"
          echo "  sw-description      : ✅"
          echo "  U-Boot Secure Boot  : ✅"
          echo "  Dynamic slot        : ✅"
          echo "  gateway-monitor src : ✅"
          echo "================================"
