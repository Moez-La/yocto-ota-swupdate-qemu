# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-moez"
BBFILE_PATTERN_meta-moez = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-moez = "6"

LAYERDEPENDS_meta-moez = "core"
LAYERSERIES_COMPAT_meta-moez = "scarthgap"
